[package]
name = "warp"
version = "0.1.0"
edition = "2024"

[features]
default = []
app = ["dep:winit", "dep:wgpu", "dep:pollster"]

[dependencies]
winit = { version = "0.29", optional = true }
wgpu = { version = "29.0.1", optional = true }
pollster = { version = "0.3", optional = true }

[lib]
path = "src/rexek_link.rs"
name = "rexek_link"

[[bin]]
name = "warp"
path = "src/main.rs"
required-features = ["app"]
